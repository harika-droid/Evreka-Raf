<style>

:root{
  --bg:#FBFAF6;--surface:#FFFFFF;--surface2:#F2F5EC;--fg:#223028;--muted:#5C6A60;--line:#DDE4D6;
  --green:#2F5D50;--green-ink:#FFFFFF;--sage:#B9D2AF;--sage-soft:#E6EFDF;
  --wood:#A8744A;--wood-dark:#7B5233;--woodtx:#7B5233;--clay:#D9A66C;
  --ok:#2E7D4F;--warn:#B7791F;--danger:#B4452F;--danger-ink:#FFFFFF;
  --band:#2F5D50;--band-fg:#F3F7EF;--frame:#2B3530;--hero:#E6EFDF;--dust:#C9C4B4;
  --shadow:0 1px 2px rgba(34,48,40,.06),0 10px 28px rgba(34,48,40,.09);
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Figtree','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131B17;--surface:#1B2520;--surface2:#212D27;--fg:#E7EEE4;--muted:#A2B2A7;--line:#2D3B33;
  --green:#8FCBA9;--green-ink:#10201A;--sage:#4A6B55;--sage-soft:#22332A;
  --wood:#C48E5E;--wood-dark:#8E6038;--woodtx:#D9A66C;--clay:#C99556;
  --ok:#6CC38B;--warn:#E0B055;--danger:#E27D63;--danger-ink:#1A0D09;
  --band:#1E3A2F;--band-fg:#E7EEE4;--frame:#34413A;--hero:#18241E;--dust:#3A4640;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131B17;--surface:#1B2520;--surface2:#212D27;--fg:#E7EEE4;--muted:#A2B2A7;--line:#2D3B33;
  --green:#8FCBA9;--green-ink:#10201A;--sage:#4A6B55;--sage-soft:#22332A;
  --wood:#C48E5E;--wood-dark:#8E6038;--woodtx:#D9A66C;--clay:#C99556;
  --ok:#6CC38B;--warn:#E0B055;--danger:#E27D63;--danger-ink:#1A0D09;
  --band:#1E3A2F;--band-fg:#E7EEE4;--frame:#34413A;--hero:#18241E;--dust:#3A4640;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font:400 1rem/1.6 var(--font-body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:60}
a{color:var(--green)}
h1,h2,h3,h4{font-family:var(--font-display);line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:clamp(2.1rem,5.2vw,3.7rem);font-weight:800}
h2{font-size:clamp(1.6rem,3.2vw,2.4rem);font-weight:700}
h3{font-size:1.15rem;font-weight:700}
h4{font-size:1rem;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--green);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sec{padding-block:clamp(44px,7vw,88px)}
.eyebrow{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--woodtx)}
.lead{font-size:1.1rem;color:var(--muted);max-width:60ch}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.sec-head{display:grid;gap:.6rem;margin-bottom:2rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#prog{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);height:3px;background:var(--green);transform-origin:left;transform:scaleX(0);z-index:70;pointer-events:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:44px;padding:.6rem 1.2rem;border-radius:999px;border:1.5px solid transparent;font-weight:600;cursor:pointer;text-decoration:none;background:transparent;line-height:1.2;text-align:center}
.btn-primary{background:var(--green);color:var(--green-ink)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{border-color:var(--green);color:var(--green)}
.btn-ghost:hover{background:var(--sage-soft)}
.btn-quiet{color:var(--fg);background:var(--surface2)}
.btn-quiet:hover{background:var(--sage-soft)}
.btn-danger{background:var(--danger);color:var(--danger-ink)}
.btn-sm{min-height:36px;padding:.35rem .9rem;font-size:.9rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.armed{background:var(--danger);color:var(--danger-ink);border-color:var(--danger)}

.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;gap:1rem;min-height:66px;position:relative;max-width:1480px}
.brand{display:flex;align-items:center;gap:.55rem;font:800 1.25rem var(--font-display);color:var(--fg);text-decoration:none;white-space:nowrap}
.nav{display:flex;gap:.2rem;flex:1;min-width:0;margin-left:.75rem}
.nav a{padding:.5rem .8rem;border-radius:999px;color:var(--fg);text-decoration:none;font-weight:500;font-size:.95rem;white-space:nowrap}
.nav a:hover,.nav a[aria-current="page"]{background:var(--sage-soft)}
.nav-auth{display:none}
.acts{display:flex;align-items:center;gap:.5rem;margin-left:auto}
.acts .auth{display:contents}
.burger{display:none;width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer}
.iconbtn{position:relative;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;display:inline-grid;place-items:center}
.iconbtn .badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--danger);color:var(--danger-ink);font-size:.72rem;font-weight:700;display:grid;place-items:center;padding:0 5px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--sage);color:var(--fg);display:inline-grid;place-items:center;font:700 1rem var(--font-display);overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.lg{width:88px;height:88px;font-size:2rem}
.menu{position:relative}
.menu-list{display:none;position:absolute;right:0;top:calc(100% + 8px);min-width:220px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:.4rem;z-index:55}
.menu.open .menu-list{display:grid}
.menu-list a,.menu-list button{display:block;text-align:left;padding:.6rem .8rem;border-radius:10px;border:0;background:none;color:var(--fg);text-decoration:none;cursor:pointer;font-size:.95rem}
.menu-list a:hover,.menu-list button:hover{background:var(--sage-soft)}
@media(max-width:1560px){
  .burger{display:inline-grid;place-items:center}
  .nav{display:none;position:absolute;left:0;right:0;top:100%;flex-direction:column;background:var(--surface);border-bottom:1px solid var(--line);padding:.5rem max(16px,env(safe-area-inset-right,0px)) 1rem max(16px,env(safe-area-inset-left,0px));margin:0;box-shadow:var(--shadow)}
  .nav.open{display:flex}
  .nav-auth{display:flex;gap:.5rem;margin-top:.5rem;flex-wrap:wrap}
  .acts .auth{display:none}
  .acts .hide-m{display:none}
}

.hero{--p:0;background:var(--hero);overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:clamp(24px,5vw,64px);align-items:center;padding-block:clamp(36px,6vw,72px)}
.hero-copy{display:grid;gap:1.2rem;justify-items:start}
.hero-copy .lead{max-width:52ch}
.cta-row{display:flex;gap:.75rem;flex-wrap:wrap}
.case{background:var(--sage-soft);border:12px solid var(--wood);border-radius:10px;padding:18px 0 0;box-shadow:var(--shadow);position:relative}
.rowwrap{overflow:hidden;padding:0 8px}
.row{display:flex;align-items:flex-end;gap:3px;width:max-content;transform:translateX(calc(var(--p) * var(--dx) * 1px))}
.row i{display:block;width:var(--w);height:var(--h);background:var(--c);border-radius:3px 3px 1px 1px;position:relative;flex:none}
.row i::after{content:"";position:absolute;left:18%;right:18%;top:12%;height:3px;background:rgba(255,255,255,.55);box-shadow:0 9px 0 rgba(255,255,255,.35)}
.row i.lean{transform:rotate(-14deg);transform-origin:bottom left;margin-right:34px}
.row.dusty{opacity:calc(.45 + var(--p) * .55);filter:saturate(calc(.35 + var(--p) * .65))}
.board{height:16px;background:linear-gradient(var(--wood),var(--wood-dark));margin-top:0;position:relative;box-shadow:0 8px 10px -4px rgba(0,0,0,.25)}
.board b{position:absolute;right:14px;top:-34px;background:var(--surface);color:var(--fg);font:700 .72rem var(--font-body);letter-spacing:.06em;text-transform:uppercase;padding:.3rem .6rem;border-radius:6px;box-shadow:var(--shadow);transform:translateX(calc(var(--p) * -24px))}
.dust-note{position:absolute;left:18px;top:-14px;background:var(--surface);color:var(--muted);font-size:.78rem;padding:.2rem .6rem;border-radius:999px;border:1px solid var(--line);z-index:2}
@media(max-width:860px){.hero .wrap{grid-template-columns:1fr}}

.qs{margin-top:-28px;position:relative;z-index:3}
.qs form{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:1rem;display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) auto;gap:.75rem;align-items:end}
@media(max-width:860px){.qs form{grid-template-columns:1fr}}

.field{display:grid;gap:.35rem;min-width:0}
.field>label,.lbl{font-size:.85rem;font-weight:600}
.field .req{color:var(--danger)}
input[type=text],input[type=email],input[type=password],input[type=tel],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;min-height:44px;padding:.6rem .8rem;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg)}
textarea{min-height:110px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.85}
input[type=checkbox],input[type=radio]{width:1.15rem;height:1.15rem;accent-color:var(--green);flex:none}
.check{display:flex;gap:.6rem;align-items:flex-start;font-size:.92rem}
.pillgroup{display:flex;gap:.5rem;flex-wrap:wrap}
.pill{position:relative}
.pill input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0;width:100%;height:100%}
.pill span{display:inline-flex;align-items:center;min-height:40px;padding:.4rem 1rem;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:.92rem}
.pill input:checked+span{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.pill input:focus-visible+span{outline:2.5px solid var(--green);outline-offset:2px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}
.form-grid .full{grid-column:1/-1}
@media(max-width:640px){.form-grid{grid-template-columns:1fr}}
.panelbox{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:clamp(1rem,3vw,1.75rem);box-shadow:var(--shadow)}
.formpage{max-width:640px;margin:0 auto;display:grid;gap:1.25rem}
.formpage.wide{max-width:860px}
.hint{border:1.5px dashed var(--sage);border-radius:12px;background:var(--sage-soft);padding:.1rem .9rem}
.hint summary{cursor:pointer;font-weight:600;font-size:.92rem;padding:.6rem 0;list-style:none;display:flex;align-items:center;gap:.5rem}
.hint summary::-webkit-details-marker{display:none}
.hint summary::before{content:"?";display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--green);color:var(--green-ink);font-size:.8rem;font-weight:800}
.hint[open] summary{color:var(--green)}
.hint p,.hint ol{font-size:.92rem;color:var(--fg);padding-bottom:.75rem;margin:0}
.hint ol{padding-left:1.2rem}
.pw{position:relative}
.pw input{padding-right:3rem}
.pw button{position:absolute;right:4px;top:4px;width:36px;height:36px;border:0;background:none;cursor:pointer;border-radius:8px;color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--danger);transition:width .2s,background .2s}
.msg{font-size:.88rem;min-height:1.2em}
.msg.err{color:var(--danger)}.msg.ok{color:var(--ok)}
.divider{display:flex;align-items:center;gap:.75rem;color:var(--muted);font-size:.85rem}
.divider::before,.divider::after{content:"";height:1px;background:var(--line);flex:1}
.social{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.thumbs{display:flex;gap:.6rem;flex-wrap:wrap}
.thumb{position:relative;width:92px;height:122px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;cursor:pointer}
.upload{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
@media(max-width:480px){.upload{grid-template-columns:1fr}}

.chip{display:inline-flex;align-items:center;gap:.4rem;font-size:.78rem;font-weight:700;padding:.2rem .6rem;border-radius:999px;background:var(--surface2);color:var(--fg);white-space:nowrap}
.chip.bagis{background:var(--sage-soft);color:var(--green)}
.chip.odunc{background:color-mix(in srgb,var(--clay) 28%,var(--surface));color:var(--woodtx)}
.chip.takas{background:color-mix(in srgb,var(--wood) 16%,var(--surface));color:var(--woodtx)}
.chip.st-ok{background:color-mix(in srgb,var(--ok) 18%,var(--surface));color:var(--ok)}
.chip.st-warn{background:color-mix(in srgb,var(--warn) 20%,var(--surface));color:var(--warn)}
.chip.st-bad{background:color-mix(in srgb,var(--danger) 16%,var(--surface));color:var(--danger)}
.dot{width:.6rem;height:.6rem;border-radius:50%;background:var(--ok);display:inline-block}
.dot.iyi{background:var(--warn)}.dot.yipranmis{background:var(--danger)}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:1.1rem}
.bcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;min-width:0;transition:transform .2s,box-shadow .2s}
.bcard:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.bcard .cv{padding:.9rem .9rem 0;cursor:pointer;background:none;border:0;display:block;width:100%;text-align:left}
.bcard .bd{padding:.8rem .9rem .95rem;display:grid;gap:.35rem;flex:1;align-content:start}
.bcard h3{font-size:1.02rem;line-height:1.25}
.bcard .by{font-size:.88rem;color:var(--muted)}
.bcard .meta{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
.bcard .loc{font-size:.84rem;color:var(--muted)}
.bcard .btn{margin-top:.4rem;width:100%}
.cover{aspect-ratio:3/4;width:100%;max-width:100%;border-radius:6px 12px 12px 6px;background:var(--cv-bg);color:var(--cv-fg);display:flex;flex-direction:column;justify-content:space-between;padding:14px 14px 14px 20px;font-family:var(--font-display);box-shadow:inset 7px 0 0 rgba(0,0,0,.16);overflow:hidden}
.cover b{font-size:1.05rem;line-height:1.15;font-weight:800;overflow-wrap:anywhere}
.cover span{font-size:.78rem;opacity:.85;overflow-wrap:anywhere}
.cover.sm{width:56px;flex:none;padding:6px 6px 6px 9px;border-radius:3px 6px 6px 3px;box-shadow:inset 3px 0 0 rgba(0,0,0,.16)}
.cover.sm b{font-size:.55rem}.cover.sm span{display:none}
.photo{aspect-ratio:3/4;width:100%;object-fit:cover;border-radius:6px 12px 12px 6px;display:block;background:var(--surface2)}
.photo.sm{width:56px;flex:none;border-radius:3px 6px 6px 3px}
.empty{padding:2rem;border:1.5px dashed var(--line);border-radius:16px;text-align:center;display:grid;gap:.75rem;justify-items:center;color:var(--muted)}

.mock{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,.7fr);gap:clamp(16px,4vw,40px);align-items:end}
.laptop{border:10px solid var(--frame);border-bottom-width:18px;border-radius:16px 16px 6px 6px;background:var(--bg);overflow:hidden;box-shadow:var(--shadow);min-width:0}
.lap-bar{display:flex;gap:6px;padding:8px 10px;background:var(--surface2);border-bottom:1px solid var(--line);align-items:center}
.lap-bar i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.lap-bar span{margin-left:8px;font-size:.7rem;color:var(--muted);background:var(--surface);padding:2px 10px;border-radius:99px}
.lap-body{padding:14px;display:grid;gap:10px}
.lap-search{display:grid;grid-template-columns:2fr 1fr auto;gap:6px}
.lap-search div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:.78rem;color:var(--muted)}
.lap-search div.go{background:var(--green);color:var(--green-ink);border-color:var(--green);font-weight:700}
.lap-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lap-cards .mc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px;display:grid;gap:4px;font-size:.7rem}
.lap-cards .mc b{font-size:.74rem;line-height:1.15}
.phone{border:8px solid var(--frame);border-radius:28px;background:var(--bg);padding:12px 10px;display:grid;gap:8px;box-shadow:var(--shadow);max-width:260px;justify-self:center;width:100%}
.phone .bub{padding:.5rem .7rem;border-radius:14px;font-size:.78rem;max-width:88%;line-height:1.35}
.bub.in{background:var(--surface2);justify-self:start;border-bottom-left-radius:4px}
.bub.out{background:var(--green);color:var(--green-ink);justify-self:end;border-bottom-right-radius:4px}
@media(max-width:760px){.mock{grid-template-columns:1fr}}

.feat{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1.1rem}
.feat article{grid-column:span 2;padding:1.4rem;border-radius:18px;background:var(--surface);border:1px solid var(--line);display:grid;gap:.6rem;align-content:start}
.feat article.big{grid-column:span 4;background:var(--sage-soft);border-color:transparent}
.feat article.wide{grid-column:span 3}
.feat .tag{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--woodtx)}

function readImage(file,max){return new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){var img=new Image();img.onload=function(){var k=Math.min(1,max/Math.max(img.width,img.height));var c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};img.onerror=rej;img.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}

  $$('.rv').forEach(function(el){if(el.getBoundingClientRect().top>innerHeight*.95){el.classList.add('pre');io.observe(el)}});

function isbn13(base){var s=0;for(var i=0;i<12;i++)s+=Number(base[i])*(i%2?3:1);return base+((10-s%10)%10)}
function isbnOk(s){s=String(s).replace(/[^0-9Xx]/g,'');if(s.length===13){var t=0;for(var i=0;i<12;i++)t+=Number(s[i])*(i%2?3:1);return (10-t%10)%10===Number(s[12])}
  if(s.length===10){var q=0;for(var j=0;j<9;j++)q+=Number(s[j])*(10-j);q+=(s[9]==='X'||s[9]==='x')?10:Number(s[9]);return q%11===0}return false}

function setClubPage(c,u,page){var tot=Math.max(1,c.kitap.sayfa);page=Math.max(0,Math.min(tot,Math.round(Number(page)||0)));

  mirrorRead(u,c);return page-old}

function pageKulupler(){var u=me();var mine=u?myClubs(u.id):[];var q=S.cq||{};

A.clubNew=function(){if(needLogin('Kulüp kurmak için giriş yap.'))return;S.clubForm=!S.clubForm;render()};
F.clubNew=function(f,d){var u=me();if(!u)return;var t=Date.now();var bt=d.bt?new Date(d.bt+'T23:59:00').getTime():t+30*DAY;
  var c={id:'c'+uid(),ad:d.ad.trim(),aciklama:d.aciklama.trim(),il:d.il||'',kat:d.kat||'',ownerId:u.id,members:[u.id],kitap:{ad:d.kad.trim(),yazar:(d.kyz||'').trim(),sayfa:Math.max(10,Number(d.ksy)||100),bitis:bt},hedef:Math.max(5,Number(d.hedef)||50),progress:{},posts:[],sessions:[],cheers:[],created:t};

  return '<article class="post'+(p.type==='destek'?' need':'')+'"><div class="phead">'+avatarP(a,'sm')+'<div style="min-width:0"><b>'+(a?esc(a.ad):'Silinmiş üye')+'</b><div class="small muted">'+ago(p.t)+'</div></div><span class="chip'+(p.type==='destek'?' st-warn':'')+'" style="margin-left:auto">'+PTYPE[p.type]+'</span></div><p style="overflow-wrap:anywhere">'+esc(p.text)+'</p>'+
  '<div class="cta-row"><button class="btn '+(on?'btn-primary':'btn-quiet')+' btn-sm" data-act="sup" data-c="'+c.id+'" data-id="'+p.id+'" aria-pressed="'+!!on+'">'+(p.type==='destek'?'Destek ver':'Katılıyorum')+' ('+(p.sup||[]).length+')</button>'+
  (u&&(u.id===p.uid||isO)?'<button class="btn btn-quiet btn-sm" data-act="postDel" data-confirm data-c="'+c.id+'" data-id="'+p.id+'">Sil</button>':'')+(u&&u.id!==p.uid?'<button class="btn btn-quiet btn-sm" data-act="report" data-kind="post" data-id="'+p.id+'">Bildir</button>':'')+'</div></article>'}
function kAkis(c,u,isM,isO){
  var form=isM?'<form data-form="cpost" data-c="'+c.id+'" class="panelbox form-grid" style="margin-bottom:1rem"><div class="field"><label for="cp-t">Tür</label><select id="cp-t" name="type"><option value="tartisma">Tartışma</option><option value="soru">Soru</option><option value="destek">Destek istiyorum</option><option value="paylasim">Paylaşım</option></select></div><div class="field full"><label for="cp-m">Mesajın</label><textarea id="cp-m" name="text" required maxlength="500" placeholder="Okuduğun bölüm hakkında düşüncen, bir sorun ya da motivasyon isteğin..."></textarea></div><div class="full" style="grid-column:1/-1"><button class="btn btn-primary" type="submit">Paylaş</button></div></form>':'<div class="banner">Akışa yazmak için kulübe katıl.</div>';
  return form+(c.posts.length?'<div class="list">'+c.posts.slice(0,40).map(function(p){return kPost(c,p,u,isO)}).join('')+'</div>':'<div class="empty"><p>Henüz paylaşım yok. İlk mesajı sen yaz.</p></div>')}
function kIlerleme(c,u,isM,isO){var tot=c.kitap.sayfa;
  var rows=c.members.map(function(id){var a=userById(id);if(!a)return '';var m=c.progress[id]||(c.progress[id]={page:0,ws:Date.now(),wb:0});var w=wk(c,m);var pc=clubPct(c,m);
    var st=w>=c.hedef?['Hedefte','st-ok']:w>=c.hedef/2?['Yolunda','']:['Geride','st-warn'];var cheered=(c.cheers||[]).filter(function(x){return x.to===id&&Date.now()-x.t<7*DAY}).length;
    var can=u&&u.id!==id&&isM&&w<c.hedef/2;var recent=u&&(c.cheers||[]).some(function(x){return x.from===u.id&&x.to===id&&Date.now()-x.t<DAY});
    return '<div class="prow">'+avatarP(a,'sm')+'<div style="min-width:0"><b>'+esc(a.ad)+'</b>'+(id===c.ownerId?' <span class="chip">Kurucu</span>':'')+'<div class="bar" style="margin-top:.35rem" role="progressbar" aria-valuemin="0" aria-valuemax="'+tot+'" aria-valuenow="'+m.page+'"><i style="width:'+pc+'%"></i></div><div class="small muted">'+m.page+' / '+tot+' sayfa · %'+pc+' · bu hafta +'+w+' / '+c.hedef+(cheered?' · '+cheered+' cesaret aldı':'')+'</div></div><div class="pacts"><span class="chip '+st[1]+'">'+st[0]+'</span>'+(can?'<button class="btn btn-quiet btn-sm" data-act="cheer" data-c="'+c.id+'" data-to="'+id+'"'+(recent?' disabled':'')+'>'+(recent?'Cesaret verdin':'Cesaret Ver')+'</button>':'')+'</div></div>'}).join('');
  var mine=isM&&c.progress[u.id]?'<form data-form="cprog" data-c="'+c.id+'" class="panelbox" style="display:flex;gap:.7rem;align-items:end;flex-wrap:wrap;margin-bottom:1rem"><div class="field" style="flex:1;min-width:200px"><label for="pg-n">Şu an kaçıncı sayfadasın? (en çok '+tot+')</label><input id="pg-n" name="page" type="number" min="0" max="'+tot+'" required value="'+c.progress[u.id].page+'"></div><button class="btn btn-primary" type="submit">İlerlememi Güncelle</button></form>':'<div class="banner">İlerleme girmek için kulübe katıl.</div>';
  var chg=isO?'<details class="hint" style="margin-top:1rem"><summary>Yeni kitaba geç (kurucu)</summary><form data-form="cbook" data-c="'+c.id+'" class="form-grid" style="padding-bottom:.8rem"><div class="field"><label for="cb-ad">Kitap adı</label><input id="cb-ad" name="ad" type="text" required></div><div class="field"><label for="cb-yz">Yazar</label><input id="cb-yz" name="yz" type="text"></div><div class="field"><label for="cb-sy">Sayfa</label><input id="cb-sy" name="sy" type="number" min="10" required></div><div class="field"><label for="cb-bt">Bitiş tarihi</label><input id="cb-bt" name="bt" type="date" required value="'+new Date(Date.now()+30*DAY).toISOString().slice(0,10)+'"></div><div class="full" style="grid-column:1/-1"><button class="btn btn-primary btn-sm" type="submit">Kitabı Değiştir</button></div></form></details>':'';
  return '<p class="small muted" style="margin-bottom:.8rem">Haftalık hedef: <b>'+c.hedef+' sayfa</b>. Hedefin yarısının altında kalan üyelere "Cesaret Ver" düğmesi görünür.</p>'+mine+'<div class="list">'+rows+'</div>'+chg}
function kBulusma(c,u,isM,isO){var now=Date.now();var l=(c.sessions||[]).slice().sort(function(a,b){return a.t-b.t});
  var form=isO?'<form data-form="csess" data-c="'+c.id+'" class="panelbox form-grid" style="margin-bottom:1rem"><div class="field"><label for="cs-t">Tarih ve saat</label><input id="cs-t" name="t" type="datetime-local" required></div><div class="field"><label for="cs-k">Nasıl?</label><select id="cs-k" name="tur"><option>Çevrim içi</option><option>Yüz yüze</option></select></div><div class="field full"><label for="cs-n">Konu / yer</label><input id="cs-n" name="not" type="text" required maxlength="120" placeholder="Örn: 5-8. bölümler üzerine sohbet, Zoom bağlantısı grup akışında"></div><div class="full" style="grid-column:1/-1"><button class="btn btn-primary" type="submit">Buluşma Planla</button></div></form>':'';
  return form+(l.length?'<div class="list">'+l.map(function(s){var past=s.t<now,going=u&&(s.rsvp||[]).indexOf(u.id)>=0;return '<div class="item"'+(past?' style="opacity:.6"':'')+'><div class="grow"><b>'+new Date(s.t).toLocaleString('tr-TR',{day:'numeric',month:'long',weekday:'long',hour:'2-digit',minute:'2-digit'})+'</b> <span class="chip">'+esc(s.tur)+'</span><div class="small muted">'+esc(s.not)+' · '+(s.rsvp||[]).length+' kişi katılıyor</div></div>'+(isM&&!past?'<button class="btn '+(going?'btn-primary':'btn-quiet')+' btn-sm" data-act="rsvp" data-c="'+c.id+'" data-id="'+s.id+'" aria-pressed="'+!!going+'">'+(going?'Katılıyorum':'Katılacağım')+'</button>':past?'<span class="chip">Geçti</span>':'')+'</div>'}).join('')+'</div>':'<div class="empty"><p>Planlanmış buluşma yok.'+(isO?' Yukarıdan bir okuma seansı planla.':'')+'</p></div>')}
function kUyeler(c,u,isM,isO){return '<div class="members">'+c.members.map(function(id){var a=userById(id);if(!a)return '';return '<div class="item">'+avatarP(a,'sm')+'<div class="grow"><b>'+esc(a.ad)+'</b>'+(id===c.ownerId?' <span class="chip">Kurucu</span>':'')+'<div class="small muted">'+esc(presence(a).label)+' '+trustChip(id)+'</div></div>'+(isO&&id!==c.ownerId?'<button class="btn btn-quiet btn-sm" data-act="kick" data-confirm data-c="'+c.id+'" data-id="'+id+'">Çıkar</button>':'')+'</div>'}).join('')+'</div>'}
function pageKulup(){var c=clubById(S.clubId);
  if(!c)return '<section class="sec"><div class="wrap"><div class="empty"><p>Bu kulüp bulunamadı.</p><a class="btn btn-primary" href="#kulupler">Kulüplere Dön</a></div></div></section>';
  var u=me();var isM=!!(u&&c.members.indexOf(u.id)>=0),isO=!!(u&&c.ownerId===u.id);var tab=S.kulupTab||'akis';var left=dayLeft(c.kitap.bitis);var avg=clubAvg(c);var mem=c.members.map(userById).filter(Boolean);
  var tabs=[['akis','Sohbet ve Destek'],['ilerleme','Okuma İlerlemesi'],['bulusma','Buluşmalar'],['uyeler','Üyeler ('+c.members.length+')']];
  var body={akis:kAkis,ilerleme:kIlerleme,bulusma:kBulusma,uyeler:kUyeler}[tab](c,u,isM,isO);
  var act=isM?(isO?'<button class="btn btn-quiet" data-act="clubDel" data-confirm data-id="'+c.id+'">Kulübü Sil</button>':'<button class="btn btn-quiet" data-act="leave2" data-confirm data-id="'+c.id+'">Kulüpten Ayrıl</button>'):'<button class="btn btn-primary" data-act="join" data-id="'+c.id+'">Kulübe Katıl</button>';
  return '<section class="sec" style="padding-top:2rem"><div class="wrap"><a href="#kulupler" class="small">← Tüm kulüpler</a><div class="khead"><div style="min-width:0"><span class="eyebrow">'+(c.il?esc(c.il):'Çevrim içi')+(c.kat?' · '+esc(c.kat):'')+'</span><h1 style="font-size:clamp(1.8rem,4vw,2.8rem);margin:.3rem 0 .6rem">'+esc(c.ad)+'</h1><p class="lead" style="margin-bottom:.8rem">'+esc(c.aciklama)+'</p><div class="cta-row">'+act+'<button class="btn btn-ghost" data-act="clubBook" data-id="'+c.id+'">Kitabı Keşfet\'te Ara</button><button class="btn btn-quiet btn-sm" data-act="report" data-kind="club" data-id="'+c.id+'">Kulübü bildir</button></div></div>'+
  '<div class="panelbox kbook"><div class="cbook">'+coverHTML({ad:c.kitap.ad,yazar:c.kitap.yazar,photos:[]},true)+'<div style="min-width:0"><div class="small muted">Şu an okunan</div><b style="font-size:1.1rem">'+esc(c.kitap.ad)+'</b><div class="small muted">'+esc(c.kitap.yazar)+' · '+c.kitap.sayfa+' sayfa</div></div></div><div class="bar" style="margin:.7rem 0 .3rem"><i style="width:'+avg+'%"></i></div><div class="small muted">Kulüp ortalaması %'+avg+' · '+(left>=0?left+' gün kaldı ('+fmtDate(c.kitap.bitis)+')':'Süre doldu')+'</div><div class="avstack" style="margin-top:.7rem">'+mem.slice(0,6).map(function(x){return avatarHTML(x)}).join('')+'</div></div></div>'+
  '<div class="tabs" role="tablist" style="margin-top:1.5rem">'+tabs.map(function(t){return '<button role="tab" aria-selected="'+(tab===t[0])+'" data-act="kTab2" data-id="'+t[0]+'">'+t[1]+'</button>'}).join('')+'</div>'+body+'</div></section>'}
A.kTab2=function(el){S.kulupTab=el.dataset.id;render()};
A.join=function(el){if(needLogin('Kulübe katılmak için giriş yap.'))return;var u=me(),c=clubById(el.dataset.id);if(!c||c.members.indexOf(u.id)>=0)return;
  c.members.push(u.id);c.progress[u.id]={page:0,ws:Date.now(),wb:0};addPost(c,u.id,'paylasim','Kulübe katıldı. Merhaba!');mirrorRead(u,c);notify(c.ownerId,u.ad+' "'+c.ad+'" kulübüne katıldı.',{club:c.id});save();toast('Kulübe katıldın. Okuma listene kitap eklendi.','ok');render()};
A.leave2=function(el){var u=me(),c=clubById(el.dataset.id);if(!c)return;c.members=c.members.filter(function(x){return x!==u.id});delete c.progress[u.id];save();toast('Kulüpten ayrıldın.');goHash('kulupler')};
A.kick=function(el){var c=clubById(el.dataset.c);if(!c)return;c.members=c.members.filter(function(x){return x!==el.dataset.id});delete c.progress[el.dataset.id];notify(el.dataset.id,'"'+c.ad+'" kulübünden çıkarıldın.',{route:'kulupler'});save();render()};
A.clubDel=function(el){var c=clubById(el.dataset.id);if(!c)return;c.members.forEach(function(id){if(id!==S.uid)notify(id,'"'+c.ad+'" kulübü kapatıldı.',{route:'kulupler'})});db.clubs=db.clubs.filter(function(x){return x.id!==c.id});save();toast('Kulüp silindi.');goHash('kulupler')};
A.clubBook=function(el){var c=clubById(el.dataset.id);if(!c)return;S.q={q:c.kitap.ad,il:'',tur:'',kat:'',kond:[],tes:'',sort:'yeni'};S.kTab='tum';goHash('kesfet')};
A.sup=function(el){if(needLogin('Destek vermek için giriş yap.'))return;var u=me(),c=clubById(el.dataset.c);if(!c)return;var p=c.posts.filter(function(x){return x.id===el.dataset.id})[0];if(!p)return;p.sup=p.sup||[];var i=p.sup.indexOf(u.id);
  if(i>=0)p.sup.splice(i,1);else{p.sup.push(u.id);if(p.uid!==u.id)notify(p.uid,u.ad+' kulüpteki mesajına destek verdi.',{club:c.id})}save();render()};
A.postDel=function(el){var c=clubById(el.dataset.c);if(!c)return;c.posts=c.posts.filter(function(x){return x.id!==el.dataset.id});save();render()};
A.cheer=function(el){var u=me(),c=clubById(el.dataset.c);if(!u||!c)return;c.cheers=c.cheers||[];if(c.cheers.some(function(x){return x.from===u.id&&x.to===el.dataset.to&&Date.now()-x.t<DAY}))return;
  c.cheers.push({from:u.id,to:el.dataset.to,t:Date.now()});notify(el.dataset.to,u.ad+' sana "'+c.ad+'" kulübünde cesaret verdi. Okumaya devam!',{club:c.id});save();toast('Cesaret mesajın gönderildi.','ok');render()};
A.rsvp=function(el){var u=me(),c=clubById(el.dataset.c);if(!u||!c)return;var s=(c.sessions||[]).filter(function(x){return x.id===el.dataset.id})[0];if(!s)return;s.rsvp=s.rsvp||[];var i=s.rsvp.indexOf(u.id);if(i>=0)s.rsvp.splice(i,1);else s.rsvp.push(u.id);save();render()};
F.cpost=function(f,d){var u=me(),c=clubById(f.dataset.c);if(!u||!c||c.members.indexOf(u.id)<0||!d.text.trim())return;addPost(c,u.id,d.type,d.text.trim());
  if(d.type==='destek')c.members.forEach(function(id){if(id!==u.id)notify(id,u.ad+' "'+c.ad+'" kulübünde destek istedi.',{club:c.id})});save();f.reset();render()};
F.cprog=function(f,d){var u=me(),c=clubById(f.dataset.c);if(!u||!c||c.members.indexOf(u.id)<0)return;var diff=setClubPage(c,u,d.page);save();toast(diff>0?'İlerleme kaydedildi: +'+diff+' sayfa. Harika gidiyorsun!':'İlerleme güncellendi.','ok');render()};
F.cbook=function(f,d){var c=clubById(f.dataset.c),u=me();if(!c||!u||c.ownerId!==u.id)return;c.kitap={ad:d.ad.trim(),yazar:(d.yz||'').trim(),sayfa:Math.max(10,Number(d.sy)||100),bitis:new Date(d.bt+'T23:59:00').getTime()};
  c.members.forEach(function(id){c.progress[id]={page:0,ws:Date.now(),wb:0};var a=userById(id);if(a)mirrorRead(a,c);if(id!==u.id)notify(id,'"'+c.ad+'" yeni kitaba geçti: '+c.kitap.ad,{club:c.id})});addPost(c,u.id,'paylasim','Yeni kitaba geçiyoruz: "'+c.kitap.ad+'".');save();toast('Kulüp yeni kitaba geçti.','ok');render()};
F.csess=function(f,d){var c=clubById(f.dataset.c),u=me();if(!c||!u||c.ownerId!==u.id)return;var t=new Date(d.t).getTime();if(!t)return;c.sessions=c.sessions||[];c.sessions.push({id:'s'+uid(),t:t,tur:d.tur,not:d.not.trim(),rsvp:[u.id]});
  c.members.forEach(function(id){if(id!==u.id)notify(id,'"'+c.ad+'" için yeni buluşma planlandı: '+fmtDate(t),{club:c.id})});save();toast('Buluşma planlandı.','ok');render()};
document.addEventListener('input',function(e){var t=e.target;if(t.dataset&&t.dataset.cq!==undefined){S.cq=S.cq||{};S.cq[t.dataset.cq]=t.value;var l=$('#clubList');if(l)l.innerHTML=clubListHTML()}});

var RD={okuyor:'Şu an okuduklarım',okuyacak:'Okumak istediklerim',okudu:'Okuduklarım'};

  '<form data-form="readAdd" class="panelbox form-grid" style="margin-bottom:1.2rem"><div class="field"><label for="rd-ad">Kitap adı <span class="req">*</span></label><input id="rd-ad" name="ad" type="text" required placeholder="Örn: İnce Memed"></div><div class="field"><label for="rd-yz">Yazar</label><input id="rd-yz" name="yz" type="text" placeholder="Örn: Yaşar Kemal"></div><div class="field"><label for="rd-sy">Sayfa sayısı</label><input id="rd-sy" name="sy" type="number" min="1" placeholder="Örn: 440"></div><div class="field"><label for="rd-d">Durum</label><select id="rd-d" name="durum"><option value="okuyacak">Okumak istiyorum</option><option value="okuyor">Şu an okuyorum</option><option value="okudu">Okudum</option></select></div><div class="full" style="grid-column:1/-1"><button class="btn btn-primary" type="submit">Listeme Ekle</button></div></form>'+
  ['okuyor','okuyacak','okudu'].map(function(k){var g=l.filter(function(x){return x.durum===k});return '<h3 style="margin:1.2rem 0 .6rem">'+RD[k]+' ('+g.length+')</h3>'+(g.length?'<div class="list">'+g.map(readItem).join('')+'</div>':'<p class="muted small">Bu bölümde kitap yok.</p>')}).join('')}
F.readAdd=function(f,d){var u=me();if(!u)return;var sy=Number(d.sy)||0;arr(u,'reads').unshift({id:'k'+uid(),ad:d.ad.trim(),yazar:(d.yz||'').trim(),sayfa:sy,okunan:d.durum==='okudu'?sy:0,durum:d.durum,created:Date.now(),bitis:d.durum==='okudu'?Date.now():undefined});save();toast('Listene eklendi.','ok');render()};

F.readRate=function(f,d){var u=me(),x=u&&readById(u,f.dataset.id);if(!x)return;x.puan=Number(d.puan)||0;x.not=(d.not||'').trim();save();toast('Notun kaydedildi.','ok');render()};

    x.fillStyle='#A8744A';x.fillRect(0,960,1080,24);x.fillStyle='#FBFAF6';var rr=function(a,b2,w,h,r){x.beginPath();x.moveTo(a+r,b2);x.arcTo(a+w,b2,a+w,b2+h,r);x.arcTo(a+w,b2+h,a,b2+h,r);x.arcTo(a,b2+h,a,b2,r);x.arcTo(a,b2,a+w,b2,r);x.closePath()};rr(90,90,900,820,48);x.fill();

function monthRange(off){var n=new Date();var s=new Date(n.getFullYear(),n.getMonth()+off,1).getTime();var e=new Date(n.getFullYear(),n.getMonth()+off+1,1).getTime();return [s,e]}
function monthPoints(who,rg){var p=0,i=function(t){return t>=rg[0]&&t<rg[1]};
  db.requests.forEach(function(r){if(r.status==='tamamlandi'&&r.doneAt&&i(r.doneAt)&&(r.fromId===who||r.toId===who))p+=10});
  db.books.forEach(function(b){if(b.ownerId===who&&i(b.created))p+=2});
  db.clubs.forEach(function(c){(c.cheers||[]).forEach(function(x){if(x.from===who&&i(x.t))p+=3});(c.posts||[]).forEach(function(q){if(q.uid===who&&i(q.t)&&q.type!=='ilerleme')p+=1;if(i(q.t)&&q.uid!==who&&(q.sup||[]).indexOf(who)>=0)p+=1})});
  db.ratings.forEach(function(r){if(r.fromId===who&&i(r.t))p+=2});return p}
function monthBoard(){var cur=monthRange(0),prev=monthRange(-1);var users=db.users.filter(function(x){return x.role!=='admin'&&x.status==='aktif'});
  var rows=users.map(function(x){return {u:x,p:monthPoints(x.id,cur)}}).sort(function(a,b){return b.p-a.p}).slice(0,5);
  var pv=users.map(function(x){return {u:x,p:monthPoints(x.id,prev)}}).sort(function(a,b){return b.p-a.p})[0];var left=Math.ceil((cur[1]-Date.now())/DAY);var mn=new Date(cur[0]).toLocaleDateString('tr-TR',{month:'long',year:'numeric'});
  return '<section class="sec" style="padding-top:0"><div class="wrap"><div class="sec-head"><span class="eyebrow">Aylık görev panosu</span><h2>'+mn+' liderlik tablosu</h2><p class="muted">Dönem bitimine '+left+' gün var. Her ayın başında sıfırlanır. Teslimat 10, kitap ekleme 2, cesaret verme 3, puan verme 2, kulüp mesajı ve destek 1 puan.'+(pv&&pv.p>0?' Geçen ayın birincisi: <b>'+esc(pv.u.ad)+'</b> ('+pv.p+' puan).':'')+'</p></div><ol class="rank" style="padding:0;margin:0">'+rows.map(function(r,i){return '<li>'+avatarHTML(r.u)+'<span>'+(i+1)+'. '+esc(r.u.ad)+'</span><b>'+r.p+' puan</b></li>'}).join('')+'</ol></div></section>'}

var ENP=[[/^(\d+) kitap bulundu$/,'$1 books found'],[/^(\d+) üye$/,'$1 members'],[/^Kulüp ortalaması %(\d+)$/,'Club average $1%'],[/^Gelen talepler \((\d+)\)$/,'Incoming requests ($1)'],[/^Gönderdiğim talepler \((\d+)\)$/,'Requests I sent ($1)'],[/^Ödünç takibi \((\d+)\)$/,'Loan tracking ($1)'],[/^Favorilerim \((\d+)\)$/,'My favorites ($1)'],[/^İstek listem \((\d+)\)$/,'My wish list ($1)'],[/^Üyeler \((\d+)\)$/,'Members ($1)'],[/^(\d+) eşleşme$/,'$1 matches'],[/^Çevrim dışı · son görülme (.+)$/,'Offline · last seen $1'],[/^(\d+) gün gecikti$/,'$1 days overdue'],[/^İade: (.+)$/,'Due: $1']];
function trNode(n){var v=n.nodeValue;if(!v)return;var k=v.trim();if(!k)return;var t=EN[k];if(t!==undefined){n.nodeValue=v.replace(k,t);return}for(var i=0;i<ENP.length;i++){if(ENP[i][0].test(k)){n.nodeValue=v.replace(k,k.replace(ENP[i][0],ENP[i][1]));return}}}
function trAttrs(el){['placeholder','aria-label','title'].forEach(function(a){var v=el.getAttribute&&el.getAttribute(a);if(v&&EN[v])el.setAttribute(a,EN[v])})}
function trTree(root){if(LANG!=='en'||!root)return;if(root.nodeType===3){if(root.parentNode&&/^(SCRIPT|STYLE|TEXTAREA)$/.test(root.parentNode.nodeName))return;trNode(root);return}if(root.nodeType!==1||typeof document.createTreeWalker!=='function')return;
  trAttrs(root);var w=document.createTreeWalker(root,5,null),n;while((n=w.nextNode())){if(n.nodeType===3){if(n.parentNode&&!/^(SCRIPT|STYLE|TEXTAREA)$/.test(n.parentNode.nodeName))trNode(n)}else trAttrs(n)}}
var OBS=null;
function startObs(){if(OBS||typeof MutationObserver==='undefined'||!document.body)return;OBS=new MutationObserver(function(ms){ms.forEach(function(m){for(var i=0;i<m.addedNodes.length;i++)trTree(m.addedNodes[i])})});OBS.observe(document.body,{childList:true,subtree:true})}
function stopObs(){if(OBS){OBS.disconnect();OBS=null}}
function setLang(l){LANG=l==='en'?'en':'tr';store.set(LANG_KEY,LANG);document.documentElement.lang=LANG;if(LANG==='en')startObs();else stopObs();var wasOpen=$('#modal.open');render();if(LANG==='en')trTree(document.body);if(wasOpen)A.a11y()}
applyA11y();document.documentElement.lang=LANG;if(LANG==='en')startObs();

applyTheme(store.get('evrekaraf:tema')||'sistem');
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){drawHeader()})}catch(e){}
function beat(){var u=me();if(u&&!document.hidden){u.lastSeen=Date.now();save()}}
setInterval(beat,30000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)beat()});
window.addEventListener('pagehide',function(){var u=me();if(u){u.lastSeen=Date.now();save()}});
if(API&&APIEMPTY)pushDB();
beat();
render();
})();
